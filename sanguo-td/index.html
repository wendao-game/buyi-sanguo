<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>烽火守城 · 三国塔防</title>
  <link rel="stylesheet" href="css/style.css?v=20261113-14">
</head>
<body>
  <div id="app" data-screen="home">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <canvas id="gl" width="1080" height="1920"></canvas>
    <div id="dim"></div>

    <header id="topbar">
      <div class="cur"><i class="ico coin"></i><b id="tCoins">0</b></div>
      <div class="cur"><i class="ico ticket"></i><b id="tTickets">0</b><button class="plus" data-act="nav" data-tab="gacha">+</button></div>
    </header>

    <section id="home" class="screen"></section>
    <section id="heroes" class="screen"></section>
    <section id="gacha" class="screen"></section>
    <section id="arms" class="screen"></section>

    <nav id="nav">
      <button data-act="nav" data-tab="home"><i>城</i>主城</button>
      <button data-act="nav" data-tab="heroes"><i>将</i>武将</button>
      <button data-act="nav" data-tab="arms"><i>兵</i>兵器</button>
      <button data-act="nav" data-tab="gacha"><i>募</i>招募</button>
    </nav>

    <div id="hud">
      <button class="hbtn" id="bPause" data-act="pause">Ⅱ</button>
      <span id="bTime">00:00</span>
      <button class="hbtn" id="bStats" data-act="stats" aria-label="战斗统计"><i></i><i></i><i></i></button>
      <button class="hbtn" id="bSpeed" data-act="speed">×1</button>
      <button class="hbtn" id="bAuto" data-act="auto">自动</button>
      <button class="hbtn" id="bRock" data-act="rock">石</button>
      <button class="hbtn" id="bTeam" data-act="lineup">阵</button>
      <div id="ultbar"></div>
    </div>

    <div id="tipbar" data-act="tipClose"></div>
    <div id="modal"></div>
    <div id="toast"></div>
    <div id="loading"><b>烽火守城</b><div class="bar"><i id="loadBar"></i></div><span id="loadTxt">正在加载…</span></div>
  </div>

  <!-- 脚本带版本号加载，防止手机浏览器用旧缓存：改了代码就把 BUILD 改一下；素材清单每次都取最新的 -->
  <script>
    (function () {
      var BUILD = '20261114-02';
      ['js/lib/pixi.min.js', 'js/data.js', 'js/skills.js', 'js/save.js', 'js/platform.js', 'assets/manifest.js', 'js/assets.js',
       'js/fxgen.js', 'js/art.js', 'js/sfx.js', 'js/glview.js', 'js/battle.js', 'js/ui.js', 'js/main.js'].forEach(function (s) {
        var q = s === 'assets/manifest.js' ? 't=' + Date.now() : 'v=' + BUILD;
        document.write('<script src="' + s + '?' + q + '"><\/script>');
      });
    })();
  </script>
</body>
</html>
