<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>布衣三国</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700;900&display=swap">
<style>
/* Layout: full-bleed battlefield canvas; DOM overlays float above it as paper slips with vermilion seals. */
:root {
  --ground: #27231a;   /* trampled earth */
  --ink: #15120d;
  --paper: #ebe0c5;    /* aged paper */
  --paper-2: #d9c9a3;
  --paper-ink: #2a2116;
  --seal: #b5372a;     /* vermilion seal */
  --gold: #cfa34a;
  --jade: #4f8b74;
  --text: #f0e7d1;
  --muted: #a69779;
  --veil: rgba(16, 13, 9, 0.78);
  --display: 'Ma Shan Zheng', 'STXingkai', 'KaiTi', 'STKaiti', serif;
  --body: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--text); font-family: var(--body); }
#app { position: fixed; inset: 0; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
#cv { display: block; width: 100%; height: 100%; }
button { font-family: var(--body); cursor: pointer; }
button:focus-visible, .card:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
#xpbar { position: absolute; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 6px; background: rgba(0,0,0,.45); }
#xpfill { height: 100%; width: 0; background: linear-gradient(90deg, #8f7a3a, var(--gold)); transition: width .15s; }
.hud-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hud-left { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.statline { display: flex; align-items: baseline; gap: 10px; text-shadow: 0 1px 2px #000; }
#lv { font-family: var(--display); font-size: 26px; color: var(--gold); line-height: 1; }
#rank { font-weight: 700; font-size: 14px; letter-spacing: .1em; padding: 2px 8px; background: var(--seal); color: var(--paper); border-radius: 2px; }
#hpwrap { width: 190px; max-width: 46vw; height: 10px; background: rgba(0,0,0,.5); border: 1px solid rgba(235,224,197,.25); }
#hpfill { height: 100%; width: 100%; background: #b8443a; transition: width .12s; }
#hptext { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
#slots { display: flex; flex-wrap: wrap; gap: 5px; max-width: 320px; }
.slot { position: relative; width: 30px; height: 30px; display: grid; place-items: center; font-weight: 900; font-size: 16px;
  background: var(--paper); color: var(--paper-ink); border-radius: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
.slot.skill { background: var(--seal); color: var(--paper); }
.slot.passive { background: var(--paper-2); font-size: 13px; width: 24px; height: 24px; }
.slot.gen { box-shadow: 0 0 0 2px var(--gold), 0 1px 3px rgba(0,0,0,.5); }
/* 属性：冰火雷风 */
.el-fire { --el: #c8562a; --el-glow: rgba(255,130,50,.7); }
.el-ice { --el: #3f7fb8; --el-glow: rgba(150,210,255,.7); }
.el-thunder { --el: #5a5fb0; --el-glow: rgba(190,200,255,.75); }
.el-wind { --el: #3a8a68; --el-glow: rgba(150,240,200,.7); }
.slot.el { background: var(--el); color: #fff6e4; box-shadow: 0 0 0 1px var(--el-glow), 0 0 6px var(--el-glow); }
.slot i { position: absolute; right: -3px; bottom: -4px; font-style: normal; font-size: 9px; font-weight: 700; line-height: 1;
  background: var(--ink); color: var(--gold); padding: 1px 2px; border-radius: 2px; }
.slot i.brk { background: var(--seal); color: var(--paper); }
#best { margin: 0; color: var(--gold); font-size: 14px; letter-spacing: .05em; text-align: center; }
.hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-shadow: 0 1px 2px #000; }
#time { font-family: var(--display); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
#kills { font-size: 13px; color: var(--muted); }
#chap { font-size: 12px; color: var(--gold); letter-spacing: .12em; margin-bottom: 2px; }
#goldhud { font-size: 13px; color: #ffd75a; font-variant-numeric: tabular-nums; }
.hud-btns { display: flex; gap: 6px; pointer-events: auto; margin-top: 4px; }
.iconbtn { width: 34px; height: 34px; border: 1px solid rgba(235,224,197,.3); background: rgba(21,18,13,.6); color: var(--text); border-radius: 3px; font-size: 14px; }

#bossbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  width: min(560px, calc(100% - 32px)); display: flex; align-items: center; gap: 12px; }
#bossface { position: relative; width: 56px; height: 56px; flex: none; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px var(--gold), 0 3px 8px rgba(0,0,0,.6); }
#bossface svg { display: block; width: 100%; height: 100%; }
.bossinfo { flex: 1; min-width: 0; text-align: center; }

/* 武将登场：立绘切入 */
#cutin { position: absolute; left: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 120px); width: min(560px, 100%); height: 128px;
  pointer-events: none; opacity: 0;
  background: linear-gradient(90deg, rgba(110,22,14,.92) 0%, rgba(110,22,14,.75) 55%, rgba(110,22,14,0) 100%);
  border-top: 2px solid var(--gold); border-bottom: 2px solid var(--gold); }
#cutin.show { animation: cutin 3s cubic-bezier(.2,.8,.2,1) forwards; }
/* 立绘底部贴着横幅底边，头部探出横幅上沿 */
#cut-art { position: absolute; left: 4px; bottom: 0; width: min(180px, 36vw); height: min(225px, 45vw); overflow: hidden; }
#cut-art svg { display: block; width: 100%; height: auto; filter: drop-shadow(4px 0 0 rgba(0,0,0,.35)); }
.cut-text { position: absolute; left: calc(min(180px, 36vw) + 10px); right: 12px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 4px; min-width: 0; }
#cut-name { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 6vw, 44px); color: var(--paper); line-height: 1.05; text-shadow: 0 3px 0 var(--ink); }
#cut-title { font-size: 13px; color: var(--gold); letter-spacing: .15em; }
#cut-line { font-size: 15px; color: var(--paper); }
@keyframes cutin { 0% { transform: translateX(-100%); opacity: 0; } 12% { transform: translateX(0); opacity: 1; } 82% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(-30px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #cutin.show { animation-name: bannerfade; } }

/* 选择栏：浮在屏幕上方，游戏照常进行 */
#levelup { position: absolute; z-index: 5; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 10px);
  width: min(760px, calc(100% - 16px)); box-sizing: border-box; display: grid; gap: 6px; padding: 7px;
  background: rgba(18,15,11,.9); border: 1px solid var(--gold); border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.55);
  animation: luIn .22s ease-out; }
@keyframes luIn { from { opacity: 0; transform: translate(-50%, -12px); } to { opacity: 1; transform: translate(-50%, 0); } }
/* 窄屏：选择栏放到右上角按钮（声音 / 暂停）下面，不挡住它们 */
@media (max-width: 900px) { #levelup { top: calc(env(safe-area-inset-top, 0px) + 128px); } }
@media (prefers-reduced-motion: reduce) { #levelup { animation: none; } }
.lu-head { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; padding: 0 2px; }
#lu-title { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.1; color: var(--paper); }
#lu-sub { font-size: 12px; color: var(--gold); letter-spacing: .06em; }
#lu-crit { margin-left: auto; font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
#lu-crit b { color: #ffcf5a; font-weight: 700; }
#lu-portrait { position: relative; width: 30px; height: 30px; flex: none; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px var(--gold); }
#lu-portrait svg { display: block; width: 100%; height: 100%; }
#lu-cards { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 6px; }
/* 神兵：金色卡，缓缓流动的金光 */
.card.legend { background: linear-gradient(120deg, #fff4cc 0%, #f0cf6a 40%, #ffe9a8 50%, #d9a93a 62%, #f6dc8a 100%); background-size: 220% 100%;
  box-shadow: 0 0 0 2px #ffd75a, 0 0 16px 2px rgba(255,200,80,.75); animation: legendShine 2.4s linear infinite; }
.card.legend .kind { color: #7a4a08; font-weight: 700; }
.card.legend .lvl { color: #8a2a10; }
.card.legend .seal { background: #1c140a; box-shadow: 0 0 0 2px #ffd75a, 0 0 10px rgba(255,210,90,.9); }
@keyframes legendShine { from { background-position: 0% 0; } to { background-position: 220% 0; } }
@media (prefers-reduced-motion: reduce) { .card.legend { animation: none; } }
#levelup.legend { border-color: #ffd75a; box-shadow: 0 0 22px rgba(255,200,80,.45), 0 8px 24px rgba(0,0,0,.55); }
.slot.sb { box-shadow: 0 0 0 2px #ffd75a, 0 0 8px rgba(255,210,90,.8); }
img.ico.sb { object-fit: contain; background: radial-gradient(circle, #3a2a10, #120c05); }
#levelup .card { max-width: none; padding: 9px 10px 9px; gap: 4px; box-shadow: none; }
#levelup .card::before { inset: 3px; }
#levelup .card:hover { transform: none; filter: brightness(1.06); }
#levelup .card .top { gap: 7px; }
#levelup .seal { width: 34px; height: 34px; font-size: 18px; }
#levelup .card .nm { font-size: 15px; }
#levelup .card .kind { font-size: 11px; }
#levelup .card .lvl { font-size: 12px; }
#levelup .card .ds { font-size: 12.5px; line-height: 1.45; }
#levelup .card .key { right: 6px; top: 4px; }
.card .ds b.crit { color: var(--seal); font-variant-numeric: tabular-nums; }

/* 继续征战 */
#continue-box { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.cont-note { font-size: 13px; color: var(--muted); text-align: center; }
#title-gold { margin-left: 8px; color: #ffd75a; font-variant-numeric: tabular-nums; }
.card .kit { font-size: 12px; font-weight: 700; color: #7a6a4c; border-top: 1px dashed rgba(42,33,22,.25); padding-top: 5px; }
/* 军需 */
.shop { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: 100%; max-width: 980px; }
.shop-col { background: rgba(235,224,197,.06); border: 1px solid rgba(235,224,197,.18); border-radius: 3px; padding: 10px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.shop-col h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--paper); display: flex; align-items: baseline; gap: 8px; }
.shop-col h3 small { font-family: var(--body); font-size: 12px; color: var(--gold); letter-spacing: .1em; }
.gear { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; background: var(--paper); color: var(--paper-ink); border-radius: 2px; padding: 8px; }
.gear .seal { grid-row: span 2; width: 44px; height: 44px; font-size: 22px; }
.gear .gn { font-weight: 900; font-size: 15px; display: flex; flex-direction: column; min-width: 0; line-height: 1.25; white-space: nowrap; }
.gear .gn small { font-weight: 700; font-size: 11px; color: #7a6a4c; }
.gear .gd { font-size: 12px; line-height: 1.45; grid-column: 2 / span 2; }
.gear .gd b { color: var(--seal); }
.gear .buy { grid-row: 1; grid-column: 3; padding: 6px 10px; font-size: 13px; font-weight: 700; border: 0; border-radius: 2px; background: var(--seal); color: var(--paper); white-space: nowrap; }
.gear .buy:disabled { background: #9a8f78; cursor: default; }
/* 装备稀有度：精良淡蓝底、传说金色底 */
.gear.r2 { background: linear-gradient(135deg, var(--paper), #d9e4ef); }
.gear.r3 { background: linear-gradient(135deg, #fff3cc, #f0d48a); box-shadow: 0 0 10px rgba(255,200,80,.5); }
.gear .buy.max { background: #6b5a3a; }
/* 存档码 */
#save-text { width: min(640px, 100%); box-sizing: border-box; font: 12px/1.4 ui-monospace, Consolas, monospace; background: rgba(235,224,197,.08); color: var(--text); border: 1px solid rgba(235,224,197,.3); border-radius: 3px; padding: 8px; resize: vertical; }
.save-msg { min-height: 1.4em; font-size: 14px; color: var(--gold); text-align: center; }
@media (max-width: 760px) { .shop { grid-template-columns: minmax(0, 1fr); } }

/* 武将图鉴 */
.codex { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 14px; width: 100%; max-width: 960px; }
.gcard { position: relative; background: var(--paper); color: var(--paper-ink); border-radius: 2px; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
.gcard .art { background: #2a241b; border-radius: 2px; }
.gcard .art svg { display: block; width: 100%; height: auto; }
.gcard .nm { font-family: var(--display); font-size: 28px; line-height: 1.1; }
.gcard .tt { font-size: 12px; color: #7a6a4c; letter-spacing: .08em; }
.gcard .drops { display: flex; flex-wrap: wrap; gap: 4px; }
.gcard .drops span { font-size: 12px; padding: 2px 6px; background: rgba(42,33,22,.08); border: 1px solid rgba(42,33,22,.18); }
.gcard .slain { position: absolute; top: 16px; right: 18px; width: 40px; height: 40px; display: grid; place-items: center; background: var(--seal); color: var(--paper);
  font-weight: 900; font-size: 20px; border-radius: 3px; transform: rotate(-8deg); box-shadow: inset 0 0 0 2px rgba(235,224,197,.4); }
.gcard.unseen .art svg, .gcard.unseen .art img { filter: brightness(0) opacity(.55); }
#bossname { font-family: var(--display); font-size: 26px; color: var(--paper); text-shadow: 0 2px 4px #000; line-height: 1.1; }
#bosstitle { font-size: 12px; color: var(--gold); letter-spacing: .2em; margin-bottom: 4px; }
#bosshp { position: relative; height: 12px; background: #110d09; border: 1px solid var(--gold); }
/* 护甲：叠在血条上方的一道亮蓝 */
#bossshield { position: absolute; left: 0; top: 0; height: 4px; width: 0; background: linear-gradient(90deg, #7ea4e8, #d6e4ff); box-shadow: 0 0 6px rgba(170,200,255,.8); transition: width .1s; }
#bossfill { height: 100%; width: 100%; background: linear-gradient(90deg, #7d1a13, var(--seal)); transition: width .1s; }

#banner { position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; opacity: 0; }
/* 武将大招演出：压暗 + 发光横幅 + 眼部特写 + 速度线 + 招式名 */
#ult { position: absolute; inset: 0; pointer-events: none; opacity: 0; --uc: 255,60,40; }
#ult.show { animation: ultAll 1.45s linear forwards; }
#ult::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,.35), rgba(0,0,0,.82)); }
.ult-flash { position: absolute; inset: 0; background: rgb(var(--uc)); mix-blend-mode: screen; opacity: 0; }
#ult.show .ult-flash { animation: ultFlash .35s ease-out; }
.ult-band { position: absolute; left: -5%; right: -5%; top: 50%; height: clamp(140px, 30vh, 260px); transform: translateY(-50%) skewY(-3deg) scaleY(0);
  overflow: hidden; background: #07060a; }
#ult.show .ult-band { animation: ultBand 1.45s cubic-bezier(.2,.9,.2,1) forwards; }
.ult-art { position: absolute; inset: -10% 0; background-repeat: no-repeat; filter: contrast(1.15) saturate(1.15); }
#ult.show .ult-art { animation: ultPan 1.45s linear forwards; }
.ult-lines { position: absolute; inset: 0; mix-blend-mode: screen;
  background: repeating-linear-gradient(180deg, transparent 0 9px, rgba(var(--uc),.10) 9px 10px, transparent 10px 23px, rgba(255,255,255,.08) 23px 24px),
              linear-gradient(90deg, rgba(var(--uc),.55), transparent 22%, transparent 78%, rgba(var(--uc),.55)); }
#ult.show .ult-lines { animation: ultLines .25s linear infinite; }
.ult-edge { position: absolute; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, rgb(var(--uc)) 20%, #fff 50%, rgb(var(--uc)) 80%, transparent);
  box-shadow: 0 0 12px 3px rgba(var(--uc),.9), 0 0 30px 8px rgba(var(--uc),.45); }
.ult-edge.top { top: 0; } .ult-edge.bottom { bottom: 0; }
.ult-text { position: absolute; left: 0; right: 0; top: calc(50% + clamp(70px, 15vh, 130px)); display: flex; flex-direction: column; align-items: center; gap: 2px; opacity: 0; }
#ult.show .ult-text { animation: ultText 1.45s cubic-bezier(.2,1.4,.3,1) forwards; }
#ult-name { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 9vw, 84px); line-height: 1; color: #fff; letter-spacing: .12em;
  text-shadow: 0 0 10px rgba(var(--uc),1), 0 0 26px rgba(var(--uc),.85), 0 4px 0 #000; }
#ult-gen { font-size: 14px; letter-spacing: .4em; color: rgb(var(--uc)); text-shadow: 0 1px 2px #000; }
@keyframes ultAll { 0% { opacity: 0; } 6% { opacity: 1; } 88% { opacity: 1; } 100% { opacity: 0; } }
@keyframes ultFlash { 0% { opacity: .7; } 100% { opacity: 0; } }
@keyframes ultBand { 0% { transform: translateY(-50%) skewY(-3deg) scaleY(0); } 12% { transform: translateY(-50%) skewY(-3deg) scaleY(1.08); } 18% { transform: translateY(-50%) skewY(-3deg) scaleY(1); } 86% { transform: translateY(-50%) skewY(-3deg) scaleY(1); } 100% { transform: translateY(-50%) skewY(-3deg) scaleY(0); } }
@keyframes ultPan { 0% { transform: translateX(7%) scale(1.12); } 100% { transform: translateX(-4%) scale(1.02); } }
@keyframes ultLines { 0% { background-position: 0 0, 0 0; } 100% { background-position: 0 24px, 0 0; } }
@keyframes ultText { 0%, 14% { opacity: 0; transform: scale(2.2); letter-spacing: .6em; } 24% { opacity: 1; transform: scale(1); letter-spacing: .12em; } 86% { opacity: 1; transform: scale(1.04); } 100% { opacity: 0; transform: scale(1.1); } }
@media (prefers-reduced-motion: reduce) { #ult.show .ult-art, #ult.show .ult-lines { animation: none; } }
/* 名将台词字幕：底部居中，压在大招演出上面 */
#vline { position: absolute; z-index: 4; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); transform: translate(-50%, 8px); opacity: 0;
  display: flex; align-items: baseline; gap: 10px; max-width: min(620px, calc(100% - 32px)); padding: 8px 16px;
  background: rgba(18,15,11,.82); border-left: 3px solid var(--seal); border-radius: 2px; pointer-events: none; }
#vline.show { animation: vline 2.8s ease forwards; }
#vl-name { flex: none; font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--gold); line-height: 1; }
#vl-text { font-size: 17px; color: var(--paper); line-height: 1.4; }
@keyframes vline { 0% { opacity: 0; transform: translate(-50%, 8px); } 8% { opacity: 1; transform: translate(-50%, 0); } 85% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #vline.show { animation-name: bannerfade; } }
@media (max-width: 560px) { #vline { bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); } #vl-name { font-size: 18px; } #vl-text { font-size: 14px; } }
#allies { font-size: 12px; color: #9cc4ff; text-shadow: 0 1px 2px #000; }
/* 顶部小提示：精英出现、攻破据点 */
#toast { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 16px); transform: translate(-50%, -20px); opacity: 0;
  display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; max-width: min(420px, calc(100% - 32px));
  background: rgba(21,18,13,.88); border: 1px solid var(--gold); border-radius: 3px; pointer-events: none; }
#toast.show { animation: toast 3.2s ease forwards; }
#toast-face { position: relative; width: 40px; height: 40px; flex: none; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px #e0703a; }
#toast-face svg { display: block; width: 100%; height: 100%; }
#toast-face .tico { display: grid; place-items: center; width: 100%; height: 100%; background: var(--gold); color: var(--ink); font-weight: 900; font-size: 20px; }
.toast-text { display: flex; flex-direction: column; min-width: 0; }
#toast-title { font-size: 15px; color: var(--paper); }
#toast-sub { font-size: 12px; color: var(--gold); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -20px); } 10% { opacity: 1; transform: translate(-50%, 0); } 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -10px); } }
@media (prefers-reduced-motion: reduce) { #toast.show { animation-name: bannerfade; } }
#banner.show { animation: banner 2.6s ease forwards; }
#banner b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(36px, 8vw, 72px); color: var(--paper);
